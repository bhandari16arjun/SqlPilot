services:
  # 1. FastAPI Backend Service
  - type: web
    name: sqlpilot-api
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: "sh -c 'python scripts/seed_database.py && python scripts/index_rag.py && uvicorn app.api:app --host 0.0.0.0 --port $PORT'"
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false

  # 2. Streamlit Frontend UI
  - type: web
    name: sqlpilot-ui
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: "sh -c 'streamlit run streamlit_app.py --server.port $PORT --server.address 0.0.0.0'"
    plan: free
    envVars:
      - key: SQLPILOT_API_URL
        value: "https://sqlpilot-api.onrender.com"
