name: Python Tests

# Trigger the workflow on pushes and pull requests to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip' # Speeds up builds by caching dependencies
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Make sure pytest is installed for the CI runner
        pip install pytest
        
    - name: Run Pytest Security Suite
      env:
        # We set the python path so pytest can discover the 'app' module
        PYTHONPATH: .
      run: |
        pytest tests/
