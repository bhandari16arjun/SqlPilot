name: Python Tests

# Trigger the workflow on pushes and pull requests to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip' # Speeds up builds by caching dependencies
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Make sure pytest is installed for the CI runner
        pip install pytest
        
    - name: Run Pytest Security Suite
      env:
        # We set the python path so pytest can discover the 'app' module
        PYTHONPATH: .
      run: |
        pytest tests/

  deploy:
    name: Auto-Deploy to Render
    needs: test # CRITICAL: Only deploy if the Pytest suite passes!
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Only deploy on pushes to main
    
    steps:
    - name: Trigger Render Deployment
      env:
        # You must add this secret to your GitHub Repository Settings -> Secrets
        RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      run: |
        if [ -z "$RENDER_DEPLOY_HOOK" ]; then
          echo "Warning: RENDER_DEPLOY_HOOK secret is not set. Skipping deployment."
          exit 0
        fi
        echo "Triggering deployment to Render..."
        curl -X GET "$RENDER_DEPLOY_HOOK"
